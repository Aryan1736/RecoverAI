spring:
  application:
    name: recover-ai-backend-test
  datasource:
    url: jdbc:h2:mem:recoverai_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

gemini:
  api-key: test-api-key
  model: gemini-3.7-flash

razorpay:
  key-id: test-key-id
  key-secret: test-key-secret
