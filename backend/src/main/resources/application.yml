server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: recover-ai-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/recoverai}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.7-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  connect-timeout-ms: ${GEMINI_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${GEMINI_READ_TIMEOUT_MS:15000}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}

recoverai:
  recovery:
    base-url: ${RECOVERY_BASE_URL:https://pay.recoverai.io/r/}
    whatsapp:
      provider: ${WHATSAPP_PROVIDER:mock}
      sender-number: ${WHATSAPP_SENDER_NUMBER:+14155238886}
      api-key: ${WHATSAPP_API_KEY:}
    email:
      provider: ${EMAIL_PROVIDER:mock}
      from-address: ${EMAIL_FROM_ADDRESS:recover@recoverai.io}
      from-name: ${EMAIL_FROM_NAME:RecoverAI Payment Recovery}
      api-key: ${EMAIL_API_KEY:}
    sms:
      provider: ${SMS_PROVIDER:mock}
      sender-id: ${SMS_SENDER_ID:RECOVER}
      api-key: ${SMS_API_KEY:}
    retry-charge:
      provider: ${RETRY_CHARGE_PROVIDER:mock}
      auto-retry-enabled: ${RETRY_CHARGE_ENABLED:true}
    webhook:
      signature-header: ${RECOVERY_OUTCOME_WEBHOOK_SIGNATURE_HEADER:X-Recovery-Signature}
    scheduler:
      enabled: ${RECOVERY_SCHEDULER_ENABLED:true}
      polling-interval-ms: ${RECOVERY_SCHEDULER_POLLING_INTERVAL_MS:5000}
      batch-size: ${RECOVERY_SCHEDULER_BATCH_SIZE:50}
    queue:
      enabled: ${RECOVERY_QUEUE_ENABLED:true}
      poll-interval-ms: ${RECOVERY_QUEUE_POLL_INTERVAL_MS:3000}
      batch-size: ${RECOVERY_QUEUE_BATCH_SIZE:25}
      max-retries: ${RECOVERY_QUEUE_MAX_RETRIES:3}
      retry-delay-seconds: ${RECOVERY_QUEUE_RETRY_DELAY_SECONDS:300}
      worker-id: ${RECOVERY_QUEUE_WORKER_ID:default-worker}
      claim-timeout-seconds: ${RECOVERY_QUEUE_CLAIM_TIMEOUT_SECONDS:300}
    strategy:
      enabled: ${RECOVERY_STRATEGY_ENABLED:true}
      execution-enabled: ${RECOVERY_STRATEGY_EXECUTION_ENABLED:true}
      min-ai-confidence: ${RECOVERY_STRATEGY_MIN_AI_CONFIDENCE:0.70}
      max-attempts: ${RECOVERY_STRATEGY_MAX_ATTEMPTS:3}
      retry-charge-enabled: ${RECOVERY_STRATEGY_RETRY_CHARGE_ENABLED:true}
      fallback-enabled: ${RECOVERY_STRATEGY_FALLBACK_ENABLED:true}
      max-channel-failures: ${RECOVERY_STRATEGY_MAX_CHANNEL_FAILURES:1}
      default-delay-seconds: ${RECOVERY_STRATEGY_DEFAULT_DELAY_SECONDS:0}
      retry-delay-seconds: ${RECOVERY_STRATEGY_RETRY_DELAY_SECONDS:300}
  security:
    jwt:
      secret: ${JWT_SECRET:recoverai-secure-jwt-signing-secret-key-must-be-at-least-256-bits-long}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
      issuer: ${JWT_ISSUER:RecoverAI}



