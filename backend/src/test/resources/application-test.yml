spring:
  application:
    name: recover-ai-backend-test
  datasource:
    url: jdbc:h2:mem:recoverai_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      status:
        order: DOWN, OUT_OF_SERVICE, DEGRADED, UP, UNKNOWN
        http-mapping:
          DEGRADED: 200
    info:
      enabled: true
    metrics:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

gemini:
  api-key: test-api-key
  model: gemini-3.7-flash
  base-url: http://localhost:8089/v1beta
  connect-timeout-ms: 1000
  read-timeout-ms: 2000

razorpay:
  key-id: test-key-id
  key-secret: test-key-secret

recoverai:
  recovery:
    base-url: https://test-pay.recoverai.io/r/
    whatsapp:
      provider: mock
      sender-number: "+14155238886"
      api-key: test-whatsapp-key
      account-sid: test-twilio-sid
      auth-token: test-twilio-token
    email:
      provider: mock
      from-address: test-recover@recoverai.io
      from-name: "RecoverAI Test Recovery"
      api-key: test-email-key
    sms:
      provider: mock
      sender-id: TESTREC
      api-key: test-sms-key
      account-sid: test-twilio-sid
      auth-token: test-twilio-token
    retry-charge:
      provider: mock
      auto-retry-enabled: true
    retry:
      base-delay-seconds: 1
      max-delay-seconds: 10
    link:
      secret: test-secure-recovery-link-secret-key-32-chars-long
      expiration-seconds: 86400
      use-signed-tokens: false
    webhook:
      signature-header: X-Recovery-Signature
    scheduler:
      enabled: false
      polling-interval-ms: 5000
      batch-size: 50
    queue:
      enabled: false
      poll-interval-ms: 3000
      batch-size: 25
      max-retries: 3
      retry-delay-seconds: 300
      worker-id: test-worker
      claim-timeout-seconds: 300
    strategy:
      enabled: true
      min-ai-confidence: 0.70
      max-attempts: 3
      retry-charge-enabled: true
      fallback-enabled: true
      max-channel-failures: 1
      default-delay-seconds: 0
      retry-delay-seconds: 300
  security:
    jwt:
      secret: recoverai-test-jwt-signing-secret-key-must-be-at-least-256-bits-long
      expiration-ms: 3600000
      issuer: RecoverAITest
  observability:
    enabled: true
    correlation-id:
      enabled: true
      header-name: X-Correlation-ID
      max-length: 64
    metrics:
      enabled: true
    queue-health:
      enabled: true
      max-dead-letter-items: 50
      max-stale-claims: 10
      max-ready-items: 1000
    provider-health:
      enabled: true
      cache-ttl-seconds: 10



