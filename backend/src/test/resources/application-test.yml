spring:
  application:
    name: recover-ai-backend-test
  datasource:
    url: jdbc:h2:mem:recoverai_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

gemini:
  api-key: test-api-key
  model: gemini-3.7-flash
  base-url: http://localhost:8089/v1beta
  connect-timeout-ms: 1000
  read-timeout-ms: 2000

razorpay:
  key-id: test-key-id
  key-secret: test-key-secret

recoverai:
  recovery:
    base-url: https://test-pay.recoverai.io/r/
    whatsapp:
      provider: mock
      sender-number: "+14155238886"
      api-key: test-whatsapp-key
    email:
      provider: mock
      from-address: test-recover@recoverai.io
      from-name: "RecoverAI Test Recovery"
      api-key: test-email-key
    sms:
      provider: mock
      sender-id: TESTREC
      api-key: test-sms-key
    retry-charge:
      provider: mock
      auto-retry-enabled: true
    webhook:
      signature-header: X-Recovery-Signature

